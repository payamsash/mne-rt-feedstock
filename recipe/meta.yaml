{% set version = "1.0.1" %}
{% set python_min = "3.11" %}

package:
  name: mne-rt
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/m/mne-rt/mne_rt-{{ version }}.tar.gz
  sha256: 5f1928af0b229d9d8d181ccc9b4ae943aa32fffde68812b162b07b301225d1f7

build:
  entry_points:
    - mne-rt = mne_rt.cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=68
    - pip
  run:
    - python >={{ python_min }}
    - mne-base >=1.8
    - mne-lsl >=1.7
    - mne-connectivity >=0.7
    - mne-features >=0.3
    - mne-icalabel >=0.5
    - numpy >=2.0,<3
    - scipy >=1.13
    - matplotlib-base >=3.9
    - nibabel >=5.0
    - pyqtgraph >=0.13
    - qtpy >=2.4
    - pyserial >=3.0
    - fooof >=1.0
    - pyunlocbox >=0.5.2
    - pactools >=0.3
    - pyyaml >=6.0
    - imageio >=2.28
    - imageio-ffmpeg
    # python-osc is not on conda-forge; install via pip if OSC feedback output is needed
    # a Qt binding (pyqt/pyside6) is required at runtime but not pinned here — install one alongside

test:
  imports:
    - mne_rt
  commands:
    - pip check
    - python -c "import mne_rt; assert mne_rt.__version__ == '{{ version }}', mne_rt.__version__"
  requires:
    - python {{ python_min }}
    - pip
    - pyqt >=5.15

about:
  home: https://github.com/payamsash/mne-rt
  summary: MNE-RT - real-time M/EEG signal processing and analysis
  doc_url: https://payamsash.github.io/mne-rt/
  dev_url: https://github.com/payamsash/mne-rt
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - payamsash
    - larsoner
